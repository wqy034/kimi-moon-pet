[package]
name = "pet-engine"
version = "0.1.1"
edition = "2021"
description = "Moon·月桌宠"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
bincode = "=1.3.3"
crc32fast = "1"
getrandom = "0.3"
device_query = "3"
ureq = { version = "2", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
fastembed = { version = "=7.5.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[profile.dev]
incremental = true

[profile.release]
lto = true
opt-level = "s"
